<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FLUXO · Página não encontrada</title>
    <!-- Página de erro do CloudFront: pode abrir em qualquer endereço, por isso os caminhos são absolutos. -->
    <link rel="icon" type="image/svg+xml" href="/02-usuario/app/marca/fluxo-favicon.svg">
    <link rel="stylesheet" href="/02-usuario/app/fluxo.css">
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: var(--fx-bg); color: var(--fx-ink); }
        .fx-erro { width: min(440px, 100%); padding: 36px 32px 30px; border: 1px solid var(--fx-line); border-radius: var(--fx-radius-lg); background: var(--fx-surface); box-shadow: var(--fx-shadow-pop); text-align: center; }
        .fx-erro img { width: 64px; height: 64px; }
        .fx-erro h1 { margin: 18px 0 8px; font-size: 1.45rem; letter-spacing: -.02em; }
        .fx-erro p { margin: 0 0 24px; color: var(--fx-ink-2); line-height: 1.55; }
        .fx-erro a { display: inline-block; padding: 11px 22px; border-radius: 12px; background: var(--fx-accent); color: var(--fx-on-accent, #fff); font-weight: 700; text-decoration: none; }
        .fx-erro a:focus-visible { outline: 2px solid var(--fx-focus); outline-offset: 3px; }
    </style>
</head>
<body>
    <main class="fx-erro">
        <img src="/02-usuario/app/marca/fluxo-icon.svg" alt="FLUXO">
        <h1>Página não encontrada</h1>
        <p>O endereço que você abriu não existe no FLUXO. Entre pelo login para chegar ao seu painel.</p>
        <a href="/01-login/index.html">Ir para o login</a>
    </main>
</body>
</html>

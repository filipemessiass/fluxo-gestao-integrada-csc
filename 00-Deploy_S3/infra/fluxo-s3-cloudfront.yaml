AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  FLUXO - site estatico em bucket S3 privado, entregue pelo CloudFront com HTTPS.
  O HTTPS e obrigatorio: a conexao com a pasta do OneDrive (File System Access API)
  so funciona em contexto seguro, e o endpoint de site do S3 e apenas HTTP.

Parameters:
  NomeDoBucket:
    Type: String
    Description: Nome globalmente unico do bucket (minusculas, numeros e hifens). Ex. fluxo-processos-integrados
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
  ClasseDePreco:
    Type: String
    Default: PriceClass_All
    AllowedValues: [PriceClass_All, PriceClass_200, PriceClass_100]
    Description: PriceClass_All inclui os pontos de presenca da America do Sul (Sao Paulo).
  Dominio:
    Type: String
    Default: ''
    Description: (Opcional) Dominio proprio, ex. fluxo.suaempresa.com.br. Deixe vazio para usar o endereco do CloudFront.
  CertificadoAcmArn:
    Type: String
    Default: ''
    Description: (Opcional) ARN do certificado ACM do dominio, emitido na regiao us-east-1. Obrigatorio se informar Dominio.

Conditions:
  TemDominio: !Not [!Equals [!Ref Dominio, '']]

Rules:
  DominioPedeCertificado:
    RuleCondition: !Not [!Equals [!Ref Dominio, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref CertificadoAcmArn, '']]
        AssertDescription: Ao informar Dominio, informe tambem o CertificadoAcmArn (certificado ACM em us-east-1).

Resources:
  # Bucket privado: ninguem acessa direto, so o CloudFront (OAC). Versionado para permitir voltar uma publicacao.
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref NomeDoBucket
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: limpa-versoes-antigas
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  AcessoCloudFront:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${NomeDoBucket}-oac'
        Description: Acesso do CloudFront ao bucket do FLUXO
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Pastas sem arquivo (ex. /01-login/) abrem o index.html delas, como num site comum.
  IndiceDasPastas:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${NomeDoBucket}-indice'
      AutoPublish: true
      FunctionConfig:
        Comment: Completa /pasta/ com index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          if (req.uri.endsWith('/')) req.uri += 'index.html';
          return req;
        }

  # Cabecalhos de seguranca. O CSP libera so o proprio site: o FLUXO nao usa CDN nem API externa.
  # 'unsafe-inline' e necessario porque as paginas tem script e estilo embutidos.
  CabecalhosDeSeguranca:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${NomeDoBucket}-seguranca'
        Comment: Cabecalhos de seguranca do FLUXO
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: 'camera=(), microphone=(), geolocation=(), payment=()'
              Override: true

  Distribuicao:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: FLUXO - Plataforma Integrada de Gestao de Demandas e Processos
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref ClasseDePreco
        Aliases: !If [TemDominio, [!Ref Dominio], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - TemDominio
          - AcmCertificateArn: !Ref CertificadoAcmArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: fluxo-s3
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt AcessoCloudFront.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: fluxo-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Politica gerenciada "CachingOptimized": respeita o Cache-Control gravado em cada arquivo pelo publicar.ps1.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref CabecalhosDeSeguranca
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IndiceDasPastas.FunctionMetadata.FunctionARN
        # Sem permissao de listar, o S3 responde 403 para arquivo inexistente: os dois viram a pagina 404 do FLUXO.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

  PoliticaDoBucket:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SomenteCloudFrontDoFluxo
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${Bucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribuicao}'
          - Sid: SomenteHttps
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt Bucket.Arn
              - !Sub '${Bucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  EnderecoDoFluxo:
    Description: Endereco para abrir o FLUXO
    Value: !If [TemDominio, !Sub 'https://${Dominio}', !Sub 'https://${Distribuicao.DomainName}']
  NomeDoBucket:
    Description: Use no publicar.ps1 (-Bucket)
    Value: !Ref Bucket
  IdDaDistribuicao:
    Description: Use no publicar.ps1 (-DistribuicaoId) para limpar o cache a cada publicacao
    Value: !Ref Distribuicao
  DominioDoCloudFront:
    Description: Aponte o CNAME do dominio proprio para este endereco
    Value: !GetAtt Distribuicao.DomainName

<body>
    <noscript>Ative o JavaScript no navegador para usar o FLUXO.</noscript>
    <script src="../../01-login/perfis.js"></script>
    <script>
        // Perfil vem do login; sem sessão (ou perfil de outro papel) volta para o login.
        (function () {
            var perfil = window.SGPI_PERFIS.ler();
            if (!perfil || perfil.papel !== 'supervisor') { location.replace('../../01-login/index.html'); return; }
            window.PAINEL_PRESET = window.SGPI_PERFIS.preset(perfil);
            window.SGPI_LOGIN_URL = '../../01-login/index.html';
        })();
    </script>
    <script src="../app/pgd-markup.js"></script>
    <script src="../app/workflow.js"></script>

<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>SGPI stage UI smoke</title>
<pre id="result">executando</pre>
<section id="sec-e3"></section>
<section id="sec-e4"></section>
<section id="sec-e5"></section>
<section id="sec-e6"></section>
<section id="sec-e7"></section>
<section id="sec-e8"></section>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>window.SGPIA = {};</script>
<script src="../../shared/js/exchange-contract.js"></script>
<script src="../js/config.js"></script>
<script src="../js/workflow.js"></script>
<script src="../js/data-api.js"></script>
<script src="../js/ui-core.js"></script>
<script>
window.SGPIA.salvarCriterioWorkflowSistema = function () { return Promise.resolve(); };
</script>
<script src="../js/sections/sec-etapas.js"></script>
<script>
(function () {
    'use strict';
    var s = window.SGPIA;
    s.definirPerfilMemoria('FM');
    var lancamentos = s.criarLancamentosDemo();
    s.carregarMemoria({
        lancamentos: lancamentos,
        criteriosWorkflow: s.criarCriteriosWorkflowDemo(lancamentos),
        reportes: s.criarReportesDemo(lancamentos)
    });
    s.estado.prefs.role = 'Analista';

    var checks = [];
    s.Sections.e3.render();
    var e3 = document.getElementById('sec-e3');
    checks.push(['E3 inicia com cinco linhas', e3.querySelectorAll('tbody tr.status-row').length === 5]);
    checks.push(['E3 possui barra horizontal superior', !!e3.querySelector('[data-stage-scroll-top]')]);
    checks.push(['E3 possui quatro filtros e filtro da etapa atual', e3.querySelectorAll('[data-stage-filter]').length === 5]);
    checks.push(['E3 possui duas páginas', e3.querySelectorAll('.stage-page-buttons button[data-stage-page="2"]').length === 2]);

    e3.querySelector('.stage-page-buttons button[data-stage-page="2"]').click();
    checks.push(['Página 2 começa em FM-0006', !!e3.querySelector('#linha-FM-0006')]);
    checks.push(['Página 2 não repete FM-0001', !e3.querySelector('#linha-FM-0001')]);

    var projeto = e3.querySelector('[data-stage-filter="projeto"]');
    projeto.value = 'Lumen';
    projeto.dispatchEvent(new Event('change'));
    checks.push(['Filtro por projeto reduz a grade', e3.querySelectorAll('tbody tr.status-row').length === 2]);
    checks.push(['Resumo do filtro indica duas demandas', e3.querySelector('.stage-filter-summary').textContent.indexOf('2 demandas') >= 0]);

    [4, 5, 6, 7, 8].forEach(function (numero) {
        s.Sections['e' + numero].render();
        var raiz = document.getElementById('sec-e' + numero);
        checks.push(['E' + numero + ' tem paginação de cinco', raiz.querySelectorAll('tbody tr.status-row').length === 5]);
        checks.push(['E' + numero + ' tem filtros', raiz.querySelectorAll('[data-stage-filter]').length === 5]);
        checks.push(['E' + numero + ' tem rolagem horizontal', !!raiz.querySelector('[data-stage-scroll-top]')]);
    });

    var falhas = checks.filter(function (item) { return !item[1]; });
    document.getElementById('result').textContent = JSON.stringify({
        ok: falhas.length === 0,
        aprovados: checks.length - falhas.length,
        total: checks.length,
        falhas: falhas.map(function (item) { return item[0]; })
    }, null, 2);
    document.title = falhas.length ? 'FALHA' : 'OK';
}());
</script>
</html>

<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>SGPI SUP-001 UI smoke</title>
<pre id="result">executando</pre>
<div id="toast-stack"></div>
<div class="modal-overlay hidden" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
        <button type="button" id="modal-close">Fechar</button>
        <h2 id="modal-title"></h2>
        <div id="modal-body"></div>
        <div id="modal-actions"></div>
    </div>
</div>
<script>window.SGPI = {};</script>
<script src="../../shared/js/exchange-contract.js"></script>
<script src="../js/config.js"></script>
<script src="../js/demand-management.js"></script>
<script src="../js/ui-core.js"></script>
<script>
(function () {
    'use strict';
    var s = window.SGPI;
    var salvos = [];
    var dataset = {
        atividades: [],
        criterios: [],
        meta: {
            exportacoesPorPerfil: { FM: 'exp-analista-fm-001' },
            datasetsPorPerfil: { FM: 'dataset-fm-001' }
        }
    };
    s.store = {
        lerDataset: function () { return dataset; },
        salvarGestaoDemanda: function (atividade, criterios, evento) {
            salvos.push({ atividade: atividade, criterios: criterios, evento: evento });
            dataset.atividades.push(atividade);
            dataset.criterios = criterios;
            return Promise.resolve({ atividade: atividade, criterios: criterios });
        },
        salvarPrefs: function () { return true; },
        lerPrefs: function () { return { incluirNaoValidados: true }; }
    };
    s.app = { renderAll: function () {} };
}());
</script>
<script src="../js/demand-management-ui.js"></script>
<script>
(function () {
    'use strict';
    var s = window.SGPI;
    var checks = [];
    function check(nome, condicao) { checks.push([nome, !!condicao]); }
    function finalizar() {
        var falhas = checks.filter(function (item) { return !item[1]; });
        document.getElementById('result').textContent = JSON.stringify({
            ok: falhas.length === 0,
            aprovados: checks.length - falhas.length,
            total: checks.length,
            falhas: falhas.map(function (item) { return item[0]; })
        }, null, 2);
        document.title = falhas.length ? 'FALHA' : 'OK';
    }

    s.demandManagementUI.abrirNovo();
    var modal = document.getElementById('modal-overlay');
    check('modal de nova demanda abre', !modal.classList.contains('hidden'));
    check('título identifica cadastro gerencial', document.getElementById('modal-title').textContent.indexOf('Nova demanda') >= 0);
    check('ID inicial segue primeiro perfil', modal.querySelector('[data-gestao-campo="id"]').value === 'JV-0001');
    check('renderiza os 16 critérios E1/E2', modal.querySelectorAll('[data-criterion-stage]').length === 16);
    check('validação inicia como Não', modal.querySelector('[data-gestao-campo="validado"]').value === 'Não');

    var analista = modal.querySelector('[data-gestao-campo="analista"]');
    analista.value = 'Filipe Messias';
    analista.dispatchEvent(new Event('change'));
    check('troca de analista recalcula o ID', modal.querySelector('[data-gestao-campo="id"]').value === 'FM-0001');
    check('vínculo EXC-003 é reconhecido', modal.querySelector('#gestao-parent-warning').textContent.indexOf('Retorno habilitado') >= 0);
    modal.querySelector('[data-gestao-campo="atividade"]').value = 'Demanda criada no smoke test';

    modal.querySelectorAll('[data-criterion-field="status"]').forEach(function (campo) {
        campo.value = '✔ Concluído';
        campo.dispatchEvent(new Event('change'));
    });
    check('interface deriva Validado=Sim após 16 conclusões', modal.querySelector('[data-gestao-campo="validado"]').value === 'Sim');

    document.querySelector('#modal-actions .cta').click();
    check('bloqueia conclusão sem evidência', !modal.querySelector('#gestao-demand-errors').classList.contains('hidden'));
    check('não persiste formulário inválido', s.store.lerDataset().atividades.length === 0);

    modal.querySelectorAll('[data-criterion-field="evidence"]').forEach(function (campo, indice) {
        campo.value = 'Evidência ' + (indice + 1);
    });
    document.querySelector('#modal-actions .cta').click();
    setTimeout(function () {
        var salvo = s.store.lerDataset();
        check('persiste uma nova demanda', salvo.atividades.length === 1);
        check('persiste os 16 critérios', salvo.criterios.length === 16);
        check('demanda persistida permanece validada', salvo.atividades[0].validado === 'Sim');
        check('ownership e prefixo permanecem alinhados', salvo.atividades[0].analista === 'Filipe Messias' && salvo.atividades[0].id === 'FM-0001');
        check('modal fecha após confirmação', modal.classList.contains('hidden'));
        finalizar();
    }, 100);
}());
</script>
</html>
